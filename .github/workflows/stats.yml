name: Profile stats

on:
  schedule: # every 6 hours
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [scripts/stats.mjs, .github/workflows/stats.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stats.mjs
        env:
          # A classic token with repo + read:org, so private and organization repos count too.
          # Without it, the card falls back to public repos only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
